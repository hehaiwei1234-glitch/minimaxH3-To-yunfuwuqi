<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H3 片段整理</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#222;--sub:#6b6b66;--line:#e1dfd8;--acc:#2f6f5e;--acc2:#e8f1ee;--warn:#b4530a}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#1f1f1c;--ink:#ecebe6;--sub:#a3a29b;--line:#34332e;--acc:#6fc0a8;--acc2:#22312d;--warn:#e0924f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--sub)}
#drop{border:2px dashed var(--line);border-radius:12px;padding:30px 16px;text-align:center;color:var(--sub);background:var(--card);cursor:pointer}
#drop.on{border-color:var(--acc);background:var(--acc2);color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
button,select{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.main{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0}
.card h3{margin:0;font-size:15px;word-break:break-all}
.sum{margin:4px 0;color:var(--sub)}
.sum b{color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin:6px 0}
.vids{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.vids figure{margin:0}
.vids figcaption{font-size:13px;color:var(--sub)}
video{width:100%;border-radius:8px;background:#000}
.tl{position:relative;height:14px;background:var(--line);border-radius:7px;margin:8px 0;overflow:hidden}
.tl i{position:absolute;top:0;bottom:0;display:block}
.tl .sp{background:var(--acc)}
.tl .cut{background:var(--warn);opacity:.85}
.legend{font-size:12px;color:var(--sub)}
.note{color:var(--sub);font-size:13px}
.err{color:var(--warn)}
#final{border-color:var(--acc)}
#final ol{margin:6px 0;padding-left:22px;color:var(--sub);font-size:13px}
@media (max-width:640px){.vids{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>H3 片段整理</h1>
<p class="sub">把 H3 出来的 mp4 拖进来。工具只剪每个片段<b>开头和结尾</b>里「没人说话、画面又几乎不动」的空等；台词、表演、句子中间的节奏一帧不动。原片不会被改，结果存在本工具文件夹里的「输出」。整理完还可以<b>按文件名顺序自动合成一个完整成片</b>（01、02、…10，数字按大小排）。</p>

<div id="drop">把 mp4 片段拖到这里（可以一次拖很多个），或者点这里选择文件</div>
<input id="file" type="file" accept="video/mp4,.mp4" multiple hidden>

<div class="bar">
  <label>剪多少：
    <select id="preset">
      <option value="safe">稳妥（推荐，宁可少剪）</option>
      <option value="more">多剪一点</option>
      <option value="bold">最大胆（先看预览再保存）</option>
    </select>
  </label>
  <label><input type="checkbox" id="doMerge" checked> 整理完自动合成完整成片</label>
  <button id="all" class="main" disabled>全部整理并保存</button>
  <button id="open">打开输出文件夹</button>
  <span id="total" class="note"></span>
</div>
<div id="final" class="card" hidden></div>
<div id="list"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const items = [];     // {id,name,card,res}
const drop = $('#drop'), fileIn = $('#file');
drop.onclick = () => fileIn.click();
fileIn.onchange = () => { addFiles(fileIn.files); fileIn.value = ''; };
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('on'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('on'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); });

async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body || {}) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || '出错了');
  return j;
}
const byName = (a, b) => a.name.localeCompare(b.name, 'zh', { numeric: true });
const fmt = x => x.toFixed(2).replace(/\.?0+$/, '') ;

async function addFiles(fl) {
  const files = Array.from(fl).filter(f => /\.mp4$/i.test(f.name)).sort(byName);
  for (const f of files) {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<h3></h3><div class="sum">正在读取…</div>`;
    card.querySelector('h3').textContent = f.name;
    $('#list').appendChild(card);
    const it = { name: f.name, card };
    items.push(it);
    try {
      const r = await fetch('/api/upload?name=' + encodeURIComponent(f.name), { method: 'POST', body: f });
      it.id = (await r.json()).id;
      await analyzeItem(it);
    } catch (e) { card.querySelector('.sum').innerHTML = `<span class="err">出错：${e.message}</span>`; }
  }
  resortCards();
  refreshTop();
}

function resortCards() {
  const list = $('#list');
  items.slice().sort(byName).forEach(it => list.appendChild(it.card));
}

async function analyzeItem(it) {
  const res = await api('/api/analyze', { id: it.id, preset: $('#preset').value });
  it.res = res;
  it.out = null;
  drawCard(it);
}

function drawCard(it) {
  const { res, card } = it;
  const total = res.dur;
  const spans = res.speech.map(([s,e]) => `<i class="sp" style="left:${s/total*100}%;width:${Math.max(0.5,(e-s)/total*100)}%"></i>`).join('');
  const cuts = res.cuts.map(c => `<i class="cut" style="left:${c.from/total*100}%;width:${(c.len)/total*100}%"></i>`).join('');
  let opts = res.cuts.map((c,i) => `<label><input type="checkbox" data-cut="${i}" checked> 剪掉${c.kind} ${fmt(c.len)} 秒（${fmt(c.from)}–${fmt(c.to)} 秒）</label>`).join('');
  if (!res.cuts.length) opts = `<span class="note">没有可以安全剪掉的地方（${res.notes.join('；') || '无'}）</span>`;
  card.innerHTML = `<h3></h3>
    <div class="sum">原长 <b>${fmt(res.dur)}</b> 秒 → 整理后 <b data-new>${fmt(res.newDur)}</b> 秒${res.cuts.length ? '' : '（原样）'}</div>
    <div class="tl" title="绿色=有人声，橙色=打算剪掉的空等">${spans}${cuts}</div>
    <div class="legend">绿色＝有人声　橙色＝剪掉的部分</div>
    <div class="opts">${opts}
      <label>整体加速 <select data-speed><option value="1">原速</option><option value="1.1">1.1 倍</option><option value="1.2">1.2 倍</option><option value="1.3">1.3 倍</option><option value="1.5">1.5 倍</option></select></label>
      <label><input type="checkbox" data-inc ${it.skipMerge ? '' : 'checked'}> 放进成片</label>
      <button data-save>整理这一个</button>
    </div>
    <div class="note" data-msg>${res.notes.length && res.cuts.length ? '没剪的地方：' + res.notes.join('；') : ''}</div>
    <div class="vids" hidden><figure><figcaption>原片</figcaption><video controls preload="metadata" src="/media/${it.id}/in"></video></figure>
    <figure><figcaption>整理后</figcaption><video controls preload="metadata" data-out></video></figure></div>`;
  card.querySelector('h3').textContent = it.name;
  const upd = () => {
    const use = [...card.querySelectorAll('[data-cut]')].filter(x => x.checked).map(x => +x.dataset.cut);
    const rm = use.reduce((s,i) => s + res.cuts[i].len, 0);
    const sp = +card.querySelector('[data-speed]').value;
    card.querySelector('[data-new]').textContent = fmt((res.dur - rm) / sp);
  };
  card.querySelectorAll('[data-cut],[data-speed]').forEach(x => x.onchange = upd);
  card.querySelector('[data-save]').onclick = () => saveItem(it, true);
  card.querySelector('[data-inc]').onchange = e => { it.skipMerge = !e.target.checked; };
}

async function saveItem(it, force) {
  const card = it.card, msg = card.querySelector('[data-msg]');
  const use = [...card.querySelectorAll('[data-cut]')].filter(x => x.checked).map(x => +x.dataset.cut);
  const speed = +card.querySelector('[data-speed]').value;
  const sig = JSON.stringify({ use, speed, preset: $('#preset').value });
  if (!force && it.sig === sig) return;          // 设置没变、已经保存过，不用重做
  msg.textContent = '正在生成…';
  try {
    const r = await api('/api/render', { id: it.id, use, speed });
    it.sig = sig;
    msg.innerHTML = `已保存（${fmt(r.dur)} 秒）：<span class="note"></span>`;
    msg.querySelector('.note').textContent = r.saved;
    const vids = card.querySelector('.vids'); vids.hidden = false;
    const v = card.querySelector('[data-out]'); v.src = `/media/${it.id}/out?t=${Date.now()}`;
  } catch (e) { it.sig = null; msg.innerHTML = `<span class="err">出错：${e.message.replace(/</g,'&lt;')}</span>`; }
}

function refreshTop() {
  const ok = items.filter(i => i.res);
  $('#all').disabled = !ok.length;
  const a = ok.reduce((s,i) => s + i.res.dur, 0), b = ok.reduce((s,i) => s + i.res.newDur, 0);
  $('#total').textContent = ok.length ? `共 ${ok.length} 个片段：${fmt(a)} 秒 → 约 ${fmt(b)} 秒（未算加速）` : '';
}
$('#all').onclick = async () => {
  $('#all').disabled = true;
  const ready = items.filter(i => i.res).sort(byName);
  for (const it of ready) await saveItem(it);
  if ($('#doMerge').checked) await mergeAll(ready);
  $('#all').disabled = false;
};

async function mergeAll(ready) {
  const box = $('#final');
  const pick = ready.filter(i => !i.skipMerge && i.sig);
  box.hidden = false;
  if (!pick.length) { box.innerHTML = '<span class="err">没有可以合成的片段（都没勾“放进成片”，或者整理时出错了）</span>'; return; }
  box.innerHTML = `<h3>完整成片</h3><div class="sum">正在合成 ${pick.length} 个片段…</div>`;
  try {
    const r = await api('/api/merge', { ids: pick.map(i => i.id) });
    box.innerHTML = `<h3>完整成片（${r.count} 个片段，共 <b>${fmt(r.dur)}</b> 秒）</h3>
      <div class="sum">已保存：<span class="note" data-p></span></div>
      <ol>${r.order.map(() => '<li></li>').join('')}</ol>
      <video controls preload="metadata" src="/media/merged/out?t=${Date.now()}"></video>`;
    box.querySelector('[data-p]').textContent = r.saved;
    box.querySelectorAll('li').forEach((li, k) => { li.textContent = r.order[k]; });
  } catch (e) { box.innerHTML = `<h3>完整成片</h3><div class="err">合成出错：${String(e.message).replace(/</g,'&lt;')}</div>`; }
}
$('#open').onclick = () => api('/api/open-output');
$('#preset').onchange = async () => {
  for (const it of items) if (it.id) { try { await analyzeItem(it); } catch (e) {} }
  refreshTop();
};
</script>
</body>
</html>
